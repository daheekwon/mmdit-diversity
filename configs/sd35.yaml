# Stable Diffusion 3.5 Medium. Settings match every earlier SD3.5 result in value_diversity/.
model:
  name: sd35
  hf_id: stabilityai/stable-diffusion-3.5-medium
  revision: b940f670f0eda2d07fbb75229e779da1ad11eb80
  local_files_only: true
  dtype: bfloat16
  offload: true            # enable_model_cpu_offload (GPUs are shared)
  resolution: 1024         # default 1024 (user 2026-11-05); value_diversity results and the legacy bases are 512
  steps: 28
  guidance: 7.0
  max_sequence_length: 256
  batch_size: 10           # images per pipeline call; a call never mixes prompts

# Component defaults. A preset switches components on; any field can be overridden from the command line,
# e.g. `v_edit.strength=0.35 pad_v.steps=0-4`. Ranges: "all", "6-23", "0,2,5-7" (blocks 0-23, steps 0-27).
method:
  v_edit:                  # image V: amplify the seed-contrast subspace, V' = V + (lam-1) Q Q^T (V - b)
    enabled: false
    basis: bases/sd35_calib32_s0-11_k256.pt    # E07 (2026-11-06): calib32 x 16 seeds, 1024, all blocks, steps 0-11
    lam: 1.14              # the same lam on every edited block (value_diversity generalize/allblock qa_l1.14, 2026-11-05)
    strength: null         # alternative to lam: relative image-V change, lam = 1 + strength/unit; set one of the two
    blocks: all
    steps: 0-11
    rows: all              # image: only image-query rows read the edited V (DESIGN_vrows_ko.md); all: every row
  pad_v:                   # image queries read the padding tokens' values x factor (attention mass unchanged)
    enabled: false
    factor: 0.25             # pad 1/4 (user final 2026-11-05: generalize/allblock ANALYSIS_u114_pad4_ko.md)
    blocks: all
    steps: 0-11            # same steps as v_edit
  head:                    # (undecided) image-query write from image keys x (1 - beta (1 - head selectivity))
    enabled: false
    beta: 0.85
    blocks: all
    steps: 0-3
  dave:                    # DC of the image stream entering `block` x alpha (DAVE paper convention)
    enabled: false
    alpha: 0.5
    block: 6
    steps: 0-3
  cads:                    # noise on the text condition, per image
    enabled: false
    noise_scale: 0.25
    tau1: 0.6
    tau2: 0.9
    psi: 1.0
    rescale: true

presets:
  original: {}
  ours: {v_edit: {enabled: true}, pad_v: {enabled: true}}
  ours_head: {v_edit: {enabled: true}, pad_v: {enabled: true}, head: {enabled: true}}
  v_edit: {v_edit: {enabled: true}}
  pad_v: {pad_v: {enabled: true}}
  dave: {dave: {enabled: true}}
  cads: {cads: {enabled: true}}
