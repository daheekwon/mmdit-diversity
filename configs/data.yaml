# Evaluation scale follows the DAVE paper (arXiv 2606.06813): 10 samples per prompt for the 1,000 ImageNet class
# labels and for 500 MS-COCO val2017 captions; FID / precision / recall / density / coverage against 10K (ImageNet)
# and 5K (COCO) real images in Inception feature space.
samples_per_prompt: 10

imagenet:
  val_dir: /NHNHOME/workspace/data/imagenet/val      # this server: one folder per WNID (val/<wnid>/ILSVRC2012_val_*.JPEG)
  devkit: null                    # earlier server: ILSVRC2012_devkit_t12 (meta.mat + validation ground truth)
  classes: /NHNHOME/workspace/data/imagenet/hf/classes.py   # used when devkit is null: HF imagenet-1k IMAGENET2012_CLASSES
  template: "a photo of a {}"     # class name = first synonym of the class (devkit meta.mat words / the same HF list)
  real_per_class: 10              # 10 x 1000 = 10K real images (first files by name in each class)
  seed_base: 0                    # seed of sample j of prompt i = seed_base + 100 i + j (same for every method)

coco:
  prompts: /NHNHOME/workspace/data/coco/captions_val2017_img500_cap500.json   # 500 val2017 images, one caption each (original; user 2026-11-06. Earlier results: the _no_coco48 file)
  real_dir: /NHNHOME/workspace/data/coco/images/val2017   # all 5,000 images
  seed_base: 1000000

# Tune sets (experiments/E01): images disjoint from the test sets above; FID / PRDC against the base dataset's real set.
imagenet_tune:
  base: imagenet
  n_classes: 50                   # first 50 classes of the fixed shuffle (random.Random(0)); same class prompts as the test
  seed_base: 2000000              # different seeds from the test, so no tune image is a test image

coco_tune:
  base: coco
  prompts: /NHNHOME/workspace/data/coco/captions_val2017_tune50.json   # 50 val2017 images outside the test 500, one caption each (original; earlier results: _no_coco48)
  seed_base: 3000000

# Video prompts: VBench (github.com/Vchitect/VBench, commit fd18b3d055cb). The long prompts are VBench's GPT-4o rewrites for
# CogVideoX-style models (prompts/augmented_prompts/gpt_enhanced_prompts), line by line with the short originals.
vbench:
  prompts: /NHNHOME/workspace/data/vbench/all_category_longer.txt
  short_prompts: /NHNHOME/workspace/data/vbench/all_category.txt
  id_prefix: vb
  categories: [animal, architecture, food, human, lifestyle, plant, scenery, vehicles]
  per_category: 100
  seed_base: 4000000

vbench_tune:                      # dimension prompts: no overlap with the 800 category prompts
  base: vbench
  prompts: /NHNHOME/workspace/data/vbench/all_dimension_longer.txt
  short_prompts: /NHNHOME/workspace/data/vbench/all_dimension.txt
  id_prefix: vd
  n_subset: 50                    # first 50 of the fixed shuffle
  seed_base: 5000000

# Fixed splits (div/splits.py, made anew 2026-11-06; not the value_diversity prompts of the earlier results).
dev:
  split: dev                      # 8 general dev prompts + 6 rare, seeds 50000-50015
  samples: 16
dev8:
  split: dev8                     # the 8 general dev prompts, seeds 40000-40015
  samples: 16
ho3:
  split: ho3                      # 18 prompts, seeds 66000-66015
  samples: 16
coco48:
  split: coco48                   # 48 COCO val2017 captions, seeds 68000-68015
  samples: 16

# V-edit basis fitting (2026-11-06, user: a calibration set separate from the splits). 32 prompts, 8 categories x 4,
# disjoint from dev / ho3 (tests/test_klein.py). Relative paths are relative to the repository root.
calibration:
  prompts: splits/calib32.txt
  seeds: 16
  seed_base: 9000000
