    blocks: 19-37
    steps: 0-5
    rows: all              # image: only image-query rows read the edited V (DESIGN_vrows_ko.md); all: every row
  pad_v:
    enabled: false
    factor: 0.25
    blocks: all
    steps: 0-5             # same steps as v_edit
  head:
    enabled: false
    beta: 0.2
    blocks: all
    steps: 0-3
  dave:
    enabled: false
    alpha: 0.2
    block: 30
    steps: 0-5
  cads:
    enabled: false
    noise_scale: 0.25
    tau1: 0.6
    tau2: 0.9
    psi: 1.0
    rescale: true

presets:
